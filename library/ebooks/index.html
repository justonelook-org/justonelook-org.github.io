<style>
:root {
  color-scheme: light;
  --ink: #30383d;
  --blue: #0b3d5c;
  --paper: #f7f5f0;
  --shelf-top: #b89a72;
  --shelf-front: #826448;
}

* { box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #ffffff;
  color: var(--ink);
  line-height: 1.7;
  margin: 0;
}

.content {
  max-width: 1040px;
  margin: 60px auto;
  padding: 0 30px;
}

h1 {
  color: var(--blue);
  font-weight: normal;
  margin: 0 0 14px;
}

.intro { margin: 0 0 42px; }

a { color: var(--blue); }

.bookshelf {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: 370px;
  gap: 0 34px;
  margin: 0 0 36px;
  padding: 0 18px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 350px,
      var(--shelf-top) 350px,
      var(--shelf-top) 357px,
      var(--shelf-front) 357px,
      var(--shelf-front) 364px,
      transparent 364px,
      transparent 370px
    );
}

.book {
  align-self: end;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  min-width: 0;
  height: 350px;
  padding: 14px 12px 18px;
  color: var(--blue);
  text-align: center;
  text-decoration: none;
  border-radius: 8px 8px 0 0;
  transition: transform 160ms ease, background-color 160ms ease;
}

.book:hover {
  background: rgba(11, 61, 92, 0.045);
  transform: translateY(-4px);
}

.book:focus-visible {
  outline: 3px solid #0788c9;
  outline-offset: 3px;
  background: rgba(7, 136, 201, 0.08);
}

.cover {
  display: block;
  width: auto;
  max-width: 100%;
  height: 255px;
  object-fit: contain;
  background: var(--paper);
  border-radius: 2px 5px 5px 2px;
  box-shadow:
    -5px 5px 0 rgba(64, 48, 32, 0.12),
    0 11px 18px rgba(38, 31, 24, 0.22);
}

.book-title {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  margin-top: 16px;
  font-size: 1rem;
  line-height: 1.35;
}


@media (max-width: 720px) {
  .content {
    margin: 38px auto;
    padding: 0 20px;
  }

  .bookshelf {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 18px;
    padding: 0 8px;
  }

  .cover { height: 245px; }
}

@media (max-width: 420px) {
  .bookshelf {
    grid-template-columns: 1fr;
    padding: 0 24px;
  }

  .book { padding-left: 18px; padding-right: 18px; }
  .cover { height: 255px; }
}

@media (prefers-reduced-motion: reduce) {
  .book { transition: none; }
}</style>
